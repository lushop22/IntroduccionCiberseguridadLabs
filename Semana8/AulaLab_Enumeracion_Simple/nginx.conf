server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens on;
    add_header X-AulaLab-Entorno "pruebas" always;
    access_log /dev/stdout combined;
    error_log /dev/stderr warn;

    location = /interno { return 403; }
    location /interno/ { return 403; }

    location /archivos/ { autoindex on; }
    location /borradores/ { autoindex on; }

    location / {
        try_files $uri $uri/ =404;
    }
}
