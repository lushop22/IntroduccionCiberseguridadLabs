services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_app
      MYSQL_PASSWORD: "${WP_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/01-inventario.sql:/docker-entrypoint-initdb.d/01-inventario.sql:ro
    command: ["--max-connect-errors=1000"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=TCP -h127.0.0.1 -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp_app
      WORDPRESS_DB_PASSWORD: "${WP_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${HTTP_PORT:-8082}:80"
    volumes:
      - wordpress_data:/var/www/html
    healthcheck:
      test: ["CMD", "php", "-r", "exit(is_file('/var/www/html/wp-load.php') ? 0 : 1);"]
      interval: 3s
      timeout: 3s
      retries: 40
  ssh:
    build: ./ssh
    ports:
      - "127.0.0.1:${SSH_PORT:-2222}:22"
    volumes:
      - ssh_keys:/var/lib/sshkeys
  setup:
    image: wordpress:cli-php8.3
    user: "33:33"
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    environment:
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp_app
      WORDPRESS_DB_PASSWORD: "${WP_DB_PASSWORD}"
      HTTP_PORT: "${HTTP_PORT:-8082}"
      WP_ADMIN_PASSWORD: "${WP_ADMIN_PASSWORD}"
      WP_AUTHOR_PASSWORD: "${WP_AUTHOR_PASSWORD}"
    volumes:
      - wordpress_data:/var/www/html
      - ./seed:/seed:ro
      - ./wordpress:/material:ro
    entrypoint: ["/bin/sh", "/seed/preparar.sh"]
    profiles: ["preparar"]
volumes:
  mysql_data:
  wordpress_data:
  ssh_keys:
